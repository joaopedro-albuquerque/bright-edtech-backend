name: Qualidade Backend

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  tests:
    name: Pytest e relatório
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar pytest
        run: pytest --cov-fail-under=80

      - name: Publicar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            htmlcov/
            report.html
          if-no-files-found: warn

      - name: Gerar relatório Allure
        if: ${{ !cancelled() }}
        run: |
          npm install -g allure-commandline --silent
          allure generate allure-results -o allure-report --clean

      - name: Publicar relatório Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      - name: Resumo da cobertura
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("coverage.xml")
          if path.is_file():
              root = ET.parse(path).getroot()
              rate = float(root.attrib.get("line-rate", "0")) * 100
          else:
              rate = 0.0

          print("## Cobertura")
          print()
          print(f"**{rate:.1f}%** das linhas de `app`.")
          print()
          print("Baixe o artifact `backend-test-report` para abrir `report.html` e `htmlcov/index.html`.")
          PY
