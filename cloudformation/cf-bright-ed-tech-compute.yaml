AWSTemplateFormatVersion: '2010-09-09'
Description: 'Camada de Computação e Roteamento Bright EdTech: ALB, ECS Fargate e Registros Route 53.'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'prod-brightedtech'

  DomainName:
    Type: String
    Default: 'brightedtech.com.br'

  HostedZoneId:
    Type: String
    Default: 'Z02019453CUZDPO3T5NKE'

  AcmCertificateArn:
    Type: String
    Default: 'arn:aws:acm:us-east-1:818651033737:certificate/cd10bfeb-10c6-4d9f-adc0-aac58aee2af5'

  AppContainerPort:
    Type: Number
    Default: 8000

  AppImage:
    Type: String
    Default: '818651033737.dkr.ecr.us-east-1.amazonaws.com/brightedtech-api:latest'

Mappings:
  FargateConfig:
    Smallest:
      CPU: 256
      Memory: 512

Resources:
  # ----------------------------------------------------------------------------
  # LOAD BALANCER
  # ----------------------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Subnets:
        - !ImportValue
          'Fn::Sub': '${EnvironmentName}-PublicSubnet1'
        - !ImportValue
          'Fn::Sub': '${EnvironmentName}-PublicSubnet2'
      SecurityGroups:
        - !ImportValue
          'Fn::Sub': '${EnvironmentName}-ALBSecurityGroup'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg'
      VpcId: !ImportValue
        'Fn::Sub': '${EnvironmentName}-VpcId'
      Port: !Ref AppContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: '/'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ----------------------------------------------------------------------------
  # CONTAINERS (ECS Fargate)
  # ----------------------------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-api'
      RetentionInDays: 14

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-api-task'
      Cpu: !FindInMap [FargateConfig, Smallest, CPU]
      Memory: !FindInMap [FargateConfig, Smallest, Memory]
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !ImportValue
        'Fn::Sub': '${EnvironmentName}-ECSTaskExecutionRoleArn'
      TaskRoleArn: !ImportValue
        'Fn::Sub': '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: api-container
          Image: !Ref AppImage
          PortMappings:
            - ContainerPort: !Ref AppContainerPort
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: DB_NAME
              Value: brightedtechdb
            - Name: S3_BUCKET_NAME
              Value: prod-brightedtech-client-docs-818651033737
            - Name: BEDROCK_MODEL_SUMMARY
              Value: us.anthropic.claude-haiku-4-5-20251001-v1:0
            - Name: BEDROCK_MODEL_EXTRACT
              Value: us.anthropic.claude-haiku-4-5-20251001-v1:0
            - Name: GEMINI_MODEL_FALLBACK
              Value: gemini-3.6-flash
            - Name: COGNITO_USER_POOL_ID
              Value: us-east-1_0AobHYnIw
            - Name: COGNITO_CLIENT_ID
              Value: 25n05802scoi61pnlptah22ij9
            - Name: COGNITO_REGION
              Value: us-east-1
            - Name: REQUIRE_AUTH
              Value: "true"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
              
  AppService:
    Type: AWS::ECS::Service
    DependsOn:
      - HTTPListener
      - HTTPSListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-api-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !ImportValue
              'Fn::Sub': '${EnvironmentName}-PublicSubnet1'
            - !ImportValue
              'Fn::Sub': '${EnvironmentName}-PublicSubnet2'
          SecurityGroups:
            - !ImportValue
              'Fn::Sub': '${EnvironmentName}-ECSSecurityGroup'
      LoadBalancers:
        - ContainerName: api-container
          ContainerPort: !Ref AppContainerPort
          TargetGroupArn: !Ref ALBTargetGroup

  # ----------------------------------------------------------------------------
  # REGISTROS DNS
  # ----------------------------------------------------------------------------
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${DomainName}'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: true

  BackendDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'backend.${DomainName}'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: true

Outputs:
  ALBDNSName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ApiURL:
    Value: !Sub 'https://api.${DomainName}'
