AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket privado para servir o Frontend via CloudFront (OAC) - Bright EdTech'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'prod-brightedtech'

Resources:
  S3FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-frontend-cf-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Value: !Ref S3FrontendBucket
    Description: 'Nome do bucket - selecione ele como Origin ao criar a CloudFront Distribution'
  BucketArn:
    Value: !GetAtt S3FrontendBucket.Arn
    Description: 'ARN do bucket'
