[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts =
    --cov=app
    --cov-branch
    --cov-config=pytest.ini
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --html=report.html
    --self-contained-html
    --css=tests/pytest-html-dark-text.css
    --junitxml=junit.xml
    --alluredir=allure-results

[coverage:report]
include_namespace_packages = true
